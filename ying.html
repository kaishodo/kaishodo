<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Art & Craft Portfolio</title>
  <!-- Swiper CSS for smooth image slider -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <style>
    /* Global dark aesthetic theme */
    body {
      margin: 0;
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      scroll-behavior: smooth;
    }

    /* Hero header section with bio and quick navigation */
    .hero-section {
      padding: 80px 20px 40px;
      text-align: center;
      max-width: 800px;
      margin: 0 auto;
    }
    .hero-title { 
      font-size: 2.5rem; 
      letter-spacing: 1px;
      margin-bottom: 15px; 
    }
    .hero-bio { 
      font-size: 1.1rem; 
      color: #aaaaaa; 
      line-height: 1.6; 
      margin-bottom: 35px; 
    }
    
    .nav-buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
    }
    .nav-btn {
      padding: 12px 28px;
      border: 1px solid #ffffff;
      color: #ffffff;
      text-decoration: none;
      border-radius: 30px;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
      transition: all 0.3s ease;
    }
    .nav-btn:hover { 
      background-color: #ffffff; 
      color: #121212; 
    }

    /* Portfolio sections */
    .portfolio-section {
      padding: 60px 20px;
      max-width: 900px;
      margin: 0 auto;
    }
    .section-title {
      font-size: 1.6rem;
      border-left: 4px solid #ffffff;
      padding-left: 14px;
      margin-bottom: 25px;
      letter-spacing: 0.5px;
    }

    /* Swiper slider container (Bridget-style mousewheel slider) */
    .swiper {
      width: 100%;
      height: 520px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .swiper-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Pagination dots styling */
    .swiper-pagination-bullet {
      background: #ffffff;
      opacity: 0.5;
    }
    .swiper-pagination-bullet-active {
      opacity: 1;
    }

    /* Footer / Contact links */
    .footer-section {
      text-align: center;
      padding: 60px 20px 80px;
      color: #666666;
      font-size: 0.9rem;
    }
    .footer-section a {
      color: #aaaaaa;
      text-decoration: none;
    }
    .footer-section a:hover {
      color: #ffffff;
    }
  </style>
</head>
<body>

  <!-- 1. Hero / Header Section -->
  <div class="hero-section">
    <h1 class="hero-title">ART & CRAFT PORTFOLIO</h1>
    <p class="hero-bio">
      Specialized in Japanese calligraphy, custom painting, and precision hand-engraving. 
      Click below to explore the collection.
    </p>
    <div class="nav-buttons">
      <a href="#engraving" class="nav-btn">Engraving Works</a>
      <a href="#calligraphy" class="nav-btn">Calligraphy & Painting</a>
    </div>
  </div>

  <!-- 2. Section 1: Custom Engraving -->
  <section id="engraving" class="portfolio-section">
    <h2 class="section-title">Engraving Works</h2>
    <div class="swiper mySwiper">
      <div class="swiper-wrapper">
        <!-- Replace with your actual engraving image filenames -->
        <div class="swiper-slide"><img src="engrave-1.jpg" alt="Engraving Artwork 1"></div>
        <div class="swiper-slide"><img src="engrave-2.jpg" alt="Engraving Artwork 2"></div>
        <div class="swiper-slide"><img src="engrave-3.jpg" alt="Engraving Artwork 3"></div>
      </div>
      <div class="swiper-pagination"></div>
    </div>
  </section>

  <!-- 3. Section 2: Calligraphy & Painting -->
  <section id="calligraphy" class="portfolio-section">
    <h2 class="section-title">Calligraphy & Painting</h2>
    <div class="swiper mySwiper">
      <div class="swiper-wrapper">
        <!-- Replace with your actual
